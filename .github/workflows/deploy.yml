name: Validate and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Validate HTML
      run: |
        echo "Validating site structure..."
        if [ ! -f "index.html" ]; then
          echo "❌ index.html not found"
          exit 1
        fi
        if [ ! -f "css/main.css" ]; then
          echo "❌ css/main.css not found"
          exit 1
        fi
        if [ ! -f "css/components.css" ]; then
          echo "❌ css/components.css not found"
          exit 1
        fi
        echo "✅ All required files found"
        
    - name: Check file sizes
      run: |
        echo "Checking file sizes..."
        ls -la css/
        ls -la assets/brand/logos/accent/
        echo "✅ File size check complete"
        
    - name: Success
      run: |
        echo "🚀 Site validation successful!"
        echo "GitHub Pages will deploy from main branch automatically"
        echo "Live site: https://getguide.github.io/lexpoint/" 